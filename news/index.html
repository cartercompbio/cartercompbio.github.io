<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Carter Lab</title>
    <link rel="icon" type="image/png" href="../assets/images/logo/favicon.png">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .year-section {
            margin-bottom: 2.5rem;
        }

        .year-header {
            margin: 0 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--line);
            font-size: 1.6rem;
        }

        .news-list {
            display: grid;
            gap: 0.75rem;
        }

        .news-list-item {
            display: grid;
            grid-template-columns: 1fr auto 9rem;
            gap: 1.5rem;
            align-items: center;
            padding: 1.1rem 1.5rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .news-list-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .news-list-date {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            text-align: right;
        }

        .news-list-title {
            color: var(--text);
            font-size: 1.05rem;
        }

        .news-list-title:hover {
            color: var(--accent);
        }

        .news-list-meta {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .news-badge {
            padding: 0.15rem 0.7rem;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface-alt);
            color: var(--muted);
            font-size: 0.8rem;
        }

        .news-badge.paper {
            border-color: rgba(19, 120, 143, 0.3);
            background: rgba(19, 120, 143, 0.06);
            color: var(--accent-strong);
        }

        .loading,
        .no-news {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .news-list-item {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .news-list-date {
                order: -1;
                text-align: left;
            }
        }
    </style>
    <script src="../news-dates.js"></script>
    <script>
        async function loadAllNews() {
            try {
                const response = await fetch('news_data.json');
                const newsItems = await response.json();

                // Sort by date (newest first)
                newsItems.sort((a, b) => {
                    const dateA = parseNewsDate(a.date);
                    const dateB = parseNewsDate(b.date);
                    return dateB - dateA;
                });

                // Group by year
                const newsByYear = {};
                newsItems.forEach(item => {
                    const year = parseNewsDate(item.date).getFullYear();
                    if (!newsByYear[year]) {
                        newsByYear[year] = [];
                    }
                    newsByYear[year].push(item);
                });

                // Display
                displayAllNews(newsByYear);

            } catch (error) {
                console.error('Error loading news:', error);
                document.getElementById('all-news').innerHTML =
                    '<div class="no-news">Error loading news.</div>';
            }
        }

        function displayAllNews(newsByYear) {
            const container = document.getElementById('all-news');
            container.className = '';
            container.innerHTML = '';

            const years = Object.keys(newsByYear).sort((a, b) => b - a);

            if (years.length === 0) {
                container.innerHTML = '<div class="no-news">No news items found.</div>';
                return;
            }

            years.forEach(year => {
                const yearSection = document.createElement('div');
                yearSection.className = 'year-section';

                const yearHeader = document.createElement('h2');
                yearHeader.className = 'year-header';
                yearHeader.textContent = year;
                yearSection.appendChild(yearHeader);

                const newsList = document.createElement('div');
                newsList.className = 'news-list';

                newsByYear[year].forEach(item => {
                    const newsItem = document.createElement('div');
                    newsItem.className = 'news-list-item';

                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'news-list-date';
                    dateDiv.textContent = formatNewsDate(item);

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'news-list-content';

                    const titleLink = document.createElement('a');
                    titleLink.className = 'news-list-title';
                    titleLink.href = `item/?id=${item.id}`;
                    titleLink.textContent = item.title;

                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'news-list-meta';

                    if (item.paper) {
                        const paperBadge = document.createElement('span');
                        paperBadge.className = 'news-badge paper';
                        paperBadge.textContent = 'Paper';
                        metaDiv.appendChild(paperBadge);
                    }

                    if (item.github) {
                        const githubBadge = document.createElement('span');
                        githubBadge.className = 'news-badge';
                        githubBadge.textContent = 'GitHub';
                        metaDiv.appendChild(githubBadge);
                    }

                    if (item.links && item.links.length > 0) {
                        const linksBadge = document.createElement('span');
                        linksBadge.className = 'news-badge';
                        linksBadge.textContent = `${item.links.length} link${item.links.length > 1 ? 's' : ''}`;
                        metaDiv.appendChild(linksBadge);
                    }

                    contentDiv.appendChild(titleLink);
                    newsItem.appendChild(contentDiv);
                    newsItem.appendChild(metaDiv);
                    newsItem.appendChild(dateDiv);
                    newsList.appendChild(newsItem);
                });

                yearSection.appendChild(newsList);
                container.appendChild(yearSection);
            });
        }

        function formatNewsDate(item) {
            if (item.dateEnd) {
                return `${formatNewsDateString(item.date, 'short', false)} - ${formatNewsDateString(item.dateEnd, 'short')}`;
            }
            return formatNewsDateString(item.date, 'short');
        }

        document.addEventListener('DOMContentLoaded', loadAllNews);
    </script>
</head>
<body>
    <nav class="main-nav main-nav--top">
        <a class="nav-brand" href="../"><img src="../assets/images/logo/favicon.png" alt=""> Carter Lab</a>
        <a href="../#home">Home</a>
        <a href="../#research">Research</a>
        <div class="nav-item has-menu">
            <a href="../#people" aria-haspopup="true">People</a>
            <div class="nav-menu">
                <a href="../#people-current">Current Team</a>
                <a href="../#people-alumni">Alumni</a>
                <a href="../#people-photos">Lab Photos</a>
            </div>
        </div>
        <a href="../#software">Software</a>
        <a href="../#publications">Publications</a>
        <a href="../#contact">Contact</a>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>News</h1>
            <p>Lab news and announcements</p>
        </div>

        <div id="all-news" class="loading">
            Loading news...
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 Carter Lab, UC San Diego. All rights reserved.</p>
    </footer>
</body>
</html>
